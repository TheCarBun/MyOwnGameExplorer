name: Build Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build and verify portable ZIP
        shell: pwsh
        run: .\build.ps1 -Version $env:GITHUB_REF_NAME

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
          fail_on_unmatched_files: true
